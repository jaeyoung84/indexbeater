[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "indexbeater"
version = "0.1.0"
description = "15년 일봉 백데이터로 매수·매도 신호를 최적화(규칙·머신러닝·딥러닝)해 코스피200·코스닥150 지수를 이기는지 검증하는 퀀트 시스템"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Signal Lab (시그널랩)" }]
keywords = ["quant", "backtest", "kospi", "kosdaq", "machine-learning", "deep-learning", "trading-signals"]
dependencies = [
  "pandas>=2.1",
  "numpy>=1.26",
  "pyarrow>=14",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "statsmodels>=0.14",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "requests>=2.31",   # krx_source (KRX Open API·OpenDART)
]

[project.optional-dependencies]
data = ["finance-datareader>=0.9.90", "yfinance>=0.2.40", "beautifulsoup4>=4.12"]
dl = ["tensorflow>=2.15,<2.20"]
dev = ["pytest>=8", "ruff>=0.5", "ipykernel", "nbstripout"]

[project.scripts]
indexbeater = "indexbeater.__main__:main"

[tool.setuptools.packages.find]
include = ["indexbeater*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "B008", "B905"]
