# Anaconda 환경 (팀 공통):  conda env create -f environment.yml  →  conda activate indexbeater
name: indexbeater
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pandas>=2.1
  - numpy>=1.26
  - pyarrow>=14
  - scipy
  - scikit-learn>=1.3
  - statsmodels
  - matplotlib
  - seaborn
  - requests
  - beautifulsoup4
  - ipykernel
  - pytest
  - ruff
  - pip
  - pip:
      - finance-datareader>=0.9.90
      - yfinance>=0.2.40
      - "tensorflow>=2.15,<2.20"
      - -e .
